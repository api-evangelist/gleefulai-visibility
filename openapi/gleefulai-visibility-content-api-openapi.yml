openapi: 3.2.0
info:
  title: Visibility AI Audit Content API
  version: 0.1.0
  description: AI visibility / AEO audit API with x402 micropayments. No API key required.
servers:
- url: https://visibility.gleefulai.com
tags:
- name: Content
paths:
  /api/content/answerability:
    get:
      summary: Help for /api/content/answerability
      operationId: _api_content_answerability_help
      responses:
        '200':
          description: Endpoint help, sample request/response
      tags:
      - Content
    post:
      summary: Content answerability score (FAQ density, claims, extractability)
      operationId: _api_content_answerability
      x-price: $0.12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  description: URL or domain to audit
      responses:
        '200':
          description: Success with data + signed receipt
        '402':
          description: Payment required (x402 challenge)
      tags:
      - Content
