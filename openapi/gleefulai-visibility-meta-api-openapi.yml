openapi: 3.2.0
info:
  title: Visibility AI Audit Meta API
  version: 0.1.0
  description: AI visibility / AEO audit API with x402 micropayments. No API key required.
servers:
- url: https://visibility.gleefulai.com
tags:
- name: Meta
paths:
  /api/meta/extract:
    get:
      summary: Help for /api/meta/extract
      operationId: _api_meta_extract_help
      responses:
        '200':
          description: Endpoint help, sample request/response
      tags:
      - Meta
    post:
      summary: Extract title, meta description, Open Graph, canonical, JSON-LD types
      operationId: _api_meta_extract
      x-price: $0.02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  description: URL or domain to audit
      responses:
        '200':
          description: Success with data + signed receipt
        '402':
          description: Payment required (x402 challenge)
      tags:
      - Meta
