openapi: 3.2.0
info:
  title: Visibility AI Audit Examples API
  version: 0.1.0
  description: AI visibility / AEO audit API with x402 micropayments. No API key required.
servers:
- url: https://visibility.gleefulai.com
tags:
- name: Examples
paths:
  /api/examples/{endpoint}:
    get:
      summary: Sample request/response for an endpoint
      parameters:
      - name: endpoint
        in: path
        required: true
        schema:
          type: string
          example: audit/score
      responses:
        '200':
          description: OK
      tags:
      - Examples
