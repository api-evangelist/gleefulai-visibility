name: Visibility (GleefulAI)
description: >-
  Visibility is an AI-visibility and answer-engine-optimization audit API from GleefulAI. It scores
  how visible and understandable a website is to AI assistants and agents, then generates the
  artifacts to improve it — audit scoring at three depths, fix generation, competitor gap and
  suggestion comparison, bot-access auditing, citation checking, and generation of `llms.txt` and
  schema markup. The unusual part is payment: there are no API keys at all. Access is metered per
  call through x402 micropayments in USDC on Base, so a caller pays per request rather than
  registering. That makes it callable by an agent with a wallet and no signup flow.
